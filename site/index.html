<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yale Menus</title>
  <meta name="description" content="Grace Hopper, Silliman and Branford dining hall menus side by side.">
  <meta name="theme-color" content="#00356b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Hopper · Silliman · Branford</h1>
    <p id="updated" class="muted"></p>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <nav class="controls" aria-label="Date and meal">
    <label class="visually-hidden" for="date">Date</label>
    <select id="date"></select>
    <div id="meals" class="tabs" role="tablist" aria-label="Meal"></div>
  </nav>

  <div class="filters">
    <div id="chips" class="chips" aria-label="Diet filters"></div>
    <button id="clear" type="button" class="link-button" hidden>Clear filters</button>
  </div>

  <p id="comparing" class="muted" hidden></p>

  <div id="college-tabs" class="tabs college-tabs" role="tablist" aria-label="College"></div>
  <main id="columns" class="columns">
    <p class="status">Loading menus…</p>
  </main>

  <footer class="muted">
    Data from <a href="https://yalehospitality.nutrislice.com/">Yale Hospitality on Nutrislice</a>, refreshed about four times a day.
    Diet and allergen tags are only as accurate as Nutrislice's. Check the official menu or ask staff if you have a serious allergy.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
